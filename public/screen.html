<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FARMAJO — Экран</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@600;700&display=swap">

<style>
:root{
  color-scheme:dark;
  --cream:#f6ead9;
  --muted:#b89a80;
  --cu:linear-gradient(180deg,#f3cfa6 0%,#d19463 55%,#a8693f 100%);
}

html,body{
  margin:0;
  height:100%;
  background:#0d0a08;
  overflow:hidden;
}

#stage{
  position:absolute;
  left:50%;
  top:50%;
  width:1920px;
  height:1080px;
  transform-origin:0 0;
  overflow:hidden;
  background:
    linear-gradient(115deg,rgba(255,255,255,.07) 0%,rgba(255,255,255,0) 38%),
    radial-gradient(ellipse at 50% 110%,rgba(150,90,50,.35),transparent 60%),
    #17110d;
  color:var(--cream);
  font-family:Inter,"Segoe UI",Arial,sans-serif;
}

#stage>*{
  position:relative;
}

.cu{
  text-shadow:none!important;
  background:var(--cu);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
}

header{
  height:132px;
  display:flex;
  align-items:center;
  padding:0 64px;
}

header img{
  width:104px;
  height:104px;
  border-radius:50%;
  box-shadow:0 0 0 3px #c98a5b,0 6px 22px rgba(0,0,0,.6);
}

.screen3-head img{
  width:72px;
  height:72px;
}

header .t{
  margin-left:30px;
  font-family:Oswald,"Arial Narrow",sans-serif;
  font-weight:600;
  font-size:88px;
  letter-spacing:.02em;
  line-height:1;
  text-shadow:0 3px 10px rgba(0,0,0,.5);
}

header .s{
  margin-left:20px;
  font-family:Oswald,"Arial Narrow",sans-serif;
  font-weight:500;
  font-size:50px;
  color:var(--cream);
  padding-top:20px;
}

main{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  padding:18px 64px 0;
}

.col{
  padding:0 28px;
  border-left:1px solid rgba(201,138,91,.45);
}

.col:first-child{
  border-left:0;
  padding-left:0;
}

.col:last-child{
  padding-right:0;
}

section+section{
  margin-top:8px;
}

h2{
  margin:6px 0 4px;
  font-family:Oswald,"Arial Narrow",sans-serif;
  font-weight:600;
  font-size:46px;
  line-height:1.15;
}

ul{
  list-style:none;
  margin:0;
  padding:0;
}

li{
  display:flex;
  align-items:baseline;
  height:33px;
  font-size:22px;
  font-weight:700;
  text-shadow:0 2px 4px rgba(0,0,0,.55);
}

.n{
  white-space:nowrap;
}

.v{
  margin-left:10px;
  color:var(--muted);
  font-size:16px;
  font-weight:600;
  white-space:nowrap;
}

.d{
  flex:1;
}

.p{
  min-width:34px;
  text-align:right;
}

.ban{
  position:absolute;
  left:64px;
  right:64px;
  bottom:22px;
  height:46px;
  display:flex;
  align-items:center;
  padding:0 24px;
  font-weight:700;
  font-size:22px;
  color:#1a120c;
  background:linear-gradient(90deg,#d9a275,#b9774a);
}

#stage{
  display:flex;
}

#menu{
  height:1080px;
  box-sizing:border-box;
  overflow:hidden;
  flex:none;
}

#menu main{
  display:block;
  column-count:4;
  column-gap:56px;
  column-rule:1px solid rgba(201,138,91,.45);
  padding:18px 64px 0;
}

#menu section{
  break-inside:avoid;
  margin-bottom:8px;
}

#menu .d{
  min-width:12px;
}

#menu h2{
  break-after:avoid;
}

#menu li{
  break-inside:avoid;
}

#menu.narrow{
  padding:28px 44px 0;
  border-right:1px solid rgba(201,138,91,.45);
}

#menu.narrow main{
  column-count:1;
  padding:0;
}

#menu.narrow li{
  height:36px;
  font-size:24px;
}

#menu.narrow h2{
  font-size:48px;
}

#menu.screen3 main{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  column-count:initial;
  column-gap:0;
  column-rule:0;
  row-gap:8px;
  align-content:start;
}

#menu.screen3 section{
  break-inside:auto;
  min-width:0;
  margin:0;
  padding:0 28px;
  border-left:1px solid rgba(201,138,91,.45);
}

#menu.screen3 section:nth-child(4n+1){
  border-left:0;
  padding-left:0;
}

#menu.screen3 section h2{
  break-after:auto;
}

#menu.screen3.narrow main{
  grid-template-columns:minmax(0,1fr);
  padding:0;
}

#menu.screen3.narrow section{
  border-left:0;
  padding:0;
}

.mt{
  font-family:Oswald,"Arial Narrow",sans-serif;
  font-weight:600;
  font-size:60px;
  line-height:1.1;
  margin-bottom:10px;
}

.ph{
  width:28px;
  height:28px;
  border-radius:50%;
  object-fit:cover;
  margin-right:10px;
  align-self:center;
  flex:none;
}

#video{
  height:1080px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.25);
}

#video video{
  width:100%;
  height:100%;
  object-fit:cover;
}

#video img{
  width:420px;
  height:420px;
  border-radius:50%;
  box-shadow:0 0 0 6px #c98a5b,0 20px 60px rgba(0,0,0,.7);
}

/* СВЕТЛАЯ ТЕМА */

#stage.theme-light{
  background:linear-gradient(135deg,#fffdf8 0%,#f1e7d8 100%);
  color:#34251c;
}

#stage.theme-light .cu{
  background:linear-gradient(180deg,#b8794e 0%,#8d5030 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
}

#stage.theme-light header .s{
  color:#594437;
}

#stage.theme-light .col{
  border-left-color:rgba(153,99,63,.28);
}

#stage.theme-light li{
  color:#38291f;
  text-shadow:none;
}

#stage.theme-light .v{
  color:#987052;
}

#stage.theme-light .ban{
  color:#fffaf3;
  background:linear-gradient(90deg,#a96d46,#805034);
}

#stage.theme-light #video{
  background:#eee1d1;
}

#stage.theme-light header img{
  box-shadow:0 0 0 3px #b8794e,0 6px 22px rgba(80,48,28,.16);
}

#stage.theme-light #video img{
  box-shadow:0 0 0 6px #b8794e,0 20px 60px rgba(80,48,28,.18);
}

/* ПРЕМИАЛЬНАЯ ТЕМА */

#stage.theme-luxury{
  background:linear-gradient(135deg,#090909 0%,#17130e 55%,#080808 100%);
  color:#fff1d5;
}

#stage.theme-luxury .cu{
  background:linear-gradient(180deg,#fff0bd 0%,#e5b85e 48%,#a66a22 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  -webkit-text-fill-color:transparent;
}

#stage.theme-luxury header .s{
  color:#e7d4ae;
}

#stage.theme-luxury .col{
  border-left-color:rgba(218,171,86,.42);
}

#stage.theme-luxury li{
  color:#fff1d5;
  text-shadow:0 2px 5px rgba(0,0,0,.7);
}

#stage.theme-luxury .v{
  color:#d5b77e;
}

#stage.theme-luxury .ban{
  color:#171008;
  background:linear-gradient(90deg,#f0d28b,#b77b2c);
}

#stage.theme-luxury header img{
  box-shadow:0 0 0 3px #d2a34f,0 8px 28px rgba(0,0,0,.65);
}

#stage.theme-luxury #video{
  background:#090807;
}

#stage.theme-luxury #video img{
  box-shadow:0 0 0 6px #d2a34f,0 20px 60px rgba(0,0,0,.7);
}

#stage.theme-luxury #menu.screen3 main{
  row-gap:12px;
}

#stage.theme-luxury #menu.screen3 section{
  border-left-color:rgba(218,171,86,.35);
}

#stage.theme-luxury #menu.screen3 section ul{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:12px;
  margin-top:8px;
}

#stage.theme-luxury #menu.screen3 .dish-card{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  height:auto;
  min-height:0;
  margin:0;
  overflow:hidden;
  border:1px solid rgba(218,171,86,.48);
  border-radius:12px;
  background:linear-gradient(155deg,rgba(46,35,20,.96),rgba(15,13,10,.98));
  box-shadow:0 8px 22px rgba(0,0,0,.35);
  text-shadow:none;
}

#stage.theme-luxury #menu.screen3 .dish-photo{
  display:block;
  width:100%;
  height:142px;
  object-fit:cover;
  flex:none;
  margin:0;
  border-radius:0;
}

#stage.theme-luxury #menu.screen3 .dish-placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle at 50% 35%,#554024,#21180f 72%);
  color:#d7ad62;
  font:600 24px Oswald,"Arial Narrow",sans-serif;
  letter-spacing:.14em;
}

#stage.theme-luxury #menu.screen3 .dish-info{
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:10px 12px 11px;
  min-width:0;
}

#stage.theme-luxury #menu.screen3 .dish-name{
  display:block;
  white-space:normal;
  font-size:23px;
  line-height:1.12;
  color:#fff0d1;
  text-shadow:none;
}

#stage.theme-luxury #menu.screen3 .dish-meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:24px;
}

#stage.theme-luxury #menu.screen3 .dish-meta .v{
  margin:0;
  font-size:17px;
}

#stage.theme-luxury #menu.screen3 .dish-meta .p{
  min-width:0;
  font-size:25px;
}

#stage.theme-luxury #menu.screen3.narrow .dish-photo{
  height:190px;
}

#stage.theme-luxury #menu.screen3.narrow .dish-name{
  font-size:28px;
}

/* ФОН MAGNIFIC */

#stage.screen3-stage.screen3-bg{
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.25),
      rgba(0,0,0,.05) 50%,
      rgba(0,0,0,.20)
    ),
    url('/magnific_glowing-redorange-hot-charcoal-embers_lJt7tzogv9.jpg')
    center center / cover no-repeat !important;
}

/* АНИМАЦИЯ ДЫМА И СВЕЧЕНИЯ — ОТДЕЛЬНЫЕ СЛОИ */

#stage.screen3-stage.screen3-bg > #atmosphere{
  position:absolute !important;
  inset:0 !important;
  width:100%;
  height:100%;
  z-index:1 !important;
  overflow:hidden;
  pointer-events:none;
}

/* Дым: первый слой */

#stage.screen3-stage.screen3-bg .smoke{
  position:absolute;
  width:100%;
  height:90%;
  bottom:-20%;
  filter:blur(45px);
  mix-blend-mode:screen;
  pointer-events:none;
  will-change:transform,opacity;
}

#stage.screen3-stage.screen3-bg .smoke-one{
  left:-20%;
  opacity:.22;
  background:
    radial-gradient(
      ellipse at 25% 75%,
      rgba(205,205,195,.30),
      transparent 52%
    ),
    radial-gradient(
      ellipse at 60% 55%,
      rgba(145,145,140,.22),
      transparent 58%
    ),
    radial-gradient(
      ellipse at 85% 80%,
      rgba(190,175,155,.16),
      transparent 50%
    );
  animation:farmajoSmokeOne 17s ease-in-out infinite alternate;
}

/* Дым: второй слой */

#stage.screen3-stage.screen3-bg .smoke-two{
  right:-25%;
  bottom:-30%;
  opacity:.16;
  background:
    radial-gradient(
      ellipse at 35% 70%,
      rgba(180,180,175,.25),
      transparent 52%
    ),
    radial-gradient(
      ellipse at 75% 55%,
      rgba(130,125,120,.20),
      transparent 60%
    );
  animation:farmajoSmokeTwo 23s ease-in-out infinite alternate;
}

/* Движение дыма */

@keyframes farmajoSmokeOne{
  0%{
    transform:translate3d(-4%,8%,0) scale(1);
    opacity:.12;
  }
  50%{
    opacity:.27;
  }
  100%{
    transform:translate3d(12%,-18%,0) scale(1.35);
    opacity:.20;
  }
}

@keyframes farmajoSmokeTwo{
  0%{
    transform:translate3d(5%,5%,0) scale(1.1);
    opacity:.08;
  }
  100%{
    transform:translate3d(-12%,-20%,0) scale(1.5);
    opacity:.23;
  }
}

/* Пульсирующее свечение углей */

#stage.screen3-stage.screen3-bg .fire-glow{
  position:absolute;
  inset:0;
  opacity:.5;
  mix-blend-mode:screen;
  pointer-events:none;
  will-change:opacity,filter;
  background:
    radial-gradient(
      ellipse at 12% 100%,
      rgba(255,75,12,.42),
      transparent 42%
    ),
    radial-gradient(
      ellipse at 85% 100%,
      rgba(255,115,20,.36),
      transparent 40%
    ),
    radial-gradient(
      ellipse at 50% 110%,
      rgba(255,145,35,.28),
      transparent 48%
    );
  animation:farmajoFireGlow 4.5s ease-in-out infinite alternate;
}

@keyframes farmajoFireGlow{
  0%{
    opacity:.28;
    filter:brightness(.8);
  }
  50%{
    opacity:.85;
    filter:brightness(1.35);
  }
  100%{
    opacity:.42;
    filter:brightness(1);
  }
}

/* КАРТОЧКИ БЛЮД */

#stage.screen3-stage #menu.screen3.luxury-paged .menu-page section ul{
  padding:8px 4px 12px;
}

#stage.screen3-stage #menu.screen3.luxury-paged .dish-card{
  position:relative;
  border:2px solid #bd8a36;
  border-radius:15px;
  background:linear-gradient(145deg,rgba(12,11,9,.98),rgba(24,18,11,.99));
  box-shadow:0 8px 22px rgba(0,0,0,.62),0 0 12px rgba(215,158,59,.13);
}

#stage.screen3-stage #menu.screen3.luxury-paged .dish-photo{
  height:150px;
  object-fit:cover;
  filter:saturate(1.08) contrast(1.04);
}

#stage.screen3-stage #menu.screen3.luxury-paged .dish-info{
  padding:10px 11px 12px;
  gap:7px;
  background:linear-gradient(180deg,rgba(38,29,18,.98),rgba(13,12,10,.99));
}

#stage.screen3-stage #menu.screen3.luxury-paged .dish-name{
  font-size:20px;
  color:#fff0cf;
  text-shadow:0 1px 8px rgba(0,0,0,.6);
}

#stage.screen3-stage #menu.screen3.luxury-paged .dish-meta .p{
  font-size:23px;
  color:#f0c66f;
}

#stage.screen3-stage #menu.screen3.luxury-paged .dish-meta .v{
  font-size:15px;
  color:#d8b979;
}

#stage.screen3-stage #menu.screen3.luxury-paged .dish-placeholder{
  background:radial-gradient(ellipse at 50% 28%,#79512b 0%,#342317 48%,#100d09 100%);
  color:#f0c66f;
}

#stage.screen3-stage #menu.screen3.luxury-paged .menu-page section h2{
  text-shadow:0 3px 18px rgba(225,164,66,.28);
  letter-spacing:.035em;
}

/* ЗАГОЛОВОК ЭКРАНА 3 */

#stage.screen3-stage #menu.screen3.luxury-paged header{
  height:150px;
  justify-content:center;
  padding:0;
}

#stage.screen3-stage #menu.screen3.luxury-paged header img{
  position:absolute;
  left:64px;
  width:104px;
  height:104px;
}

/* СЛАЙДЫ КАТЕГОРИЙ */

#stage.theme-luxury #menu.screen3.luxury-paged{
  position:relative;
}

#stage.theme-luxury #menu.screen3.luxury-paged .menu-page{
  position:absolute;
  left:0;
  right:0;
  top:150px;
  bottom:26px;
  opacity:0;
  transform:translateX(34px);
  transition:opacity .7s ease,transform .7s ease;
  pointer-events:none;
}

#stage.theme-luxury #menu.screen3.luxury-paged .menu-page.active{
  opacity:1;
  transform:translateX(0);
  pointer-events:auto;
}

#stage.theme-luxury #menu.screen3.luxury-paged header{
  height:150px;
  justify-content:center;
  padding:0;
}

#stage.theme-luxury #menu.screen3.luxury-paged header img{
  position:absolute;
  left:64px;
  width:104px;
  height:104px;
}

#stage.theme-luxury #menu.screen3.luxury-paged header .t{
  position:absolute;
  left:220px;
  right:220px;
  margin:0;
  text-align:center;
  font-size:76px;
}

#stage.theme-luxury #menu.screen3.luxury-paged .menu-page main{
  height:100%;
  box-sizing:border-box;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  padding:8px 64px 0;
  align-content:start;
  overflow:hidden;
}

#stage.theme-luxury #menu.screen3.luxury-paged .menu-page section{
  min-width:0;
  padding:0;
  border:0;
}

#stage.theme-luxury #menu.screen3.luxury-paged .menu-page section h2{
  font-size:48px;
  line-height:1.05;
  margin:2px 0 22px;
  text-align:center;
}

/* СЕТКА 3 НА 3 */

#stage.theme-luxury #menu.screen3.luxury-paged .menu-page section ul{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));
  gap:14px 16px;
  margin:0;
  height:760px;
}

#stage.theme-luxury #menu.screen3.luxury-paged .dish-card{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:row;
  align-items:stretch;
  height:100%;
  border-radius:14px;
}

#stage.theme-luxury #menu.screen3.luxury-paged .dish-photo{
  width:54%;
  height:100%;
  min-height:0;
  object-fit:cover;
  flex:none;
}

#stage.theme-luxury #menu.screen3.luxury-paged .dish-info{
  flex:1;
  justify-content:center;
  gap:12px;
  padding:12px 14px;
  min-width:0;
}

#stage.theme-luxury #menu.screen3.luxury-paged .dish-name{
  font-size:25px;
  line-height:1.12;
}

#stage.theme-luxury #menu.screen3.luxury-paged .dish-meta{
  align-items:center;
  flex-wrap:wrap;
  gap:7px;
}

#stage.theme-luxury #menu.screen3.luxury-paged .dish-meta .v{
  font-size:17px;
}

#stage.theme-luxury #menu.screen3.luxury-paged .dish-meta .p{
  font-size:27px;
}

/* УЗКИЙ ЭКРАН */

#stage.theme-luxury #menu.screen3.narrow.luxury-paged header{
  height:92px;
}

#stage.theme-luxury #menu.screen3.narrow.luxury-paged header img{
  left:28px;
  width:56px;
  height:56px;
}

#stage.theme-luxury #menu.screen3.narrow.luxury-paged header .t{
  left:100px;
  right:20px;
  font-size:38px;
}

#stage.theme-luxury #menu.screen3.narrow.luxury-paged .menu-page{
  top:92px;
}

#stage.theme-luxury #menu.screen3.narrow.luxury-paged .menu-page main{
  grid-template-columns:minmax(0,1fr);
  padding:8px 28px 0;
}

#stage.theme-luxury #menu.screen3.narrow.luxury-paged .menu-page section h2{
  font-size:38px;
  margin-bottom:16px;
}

#stage.theme-luxury #menu.screen3.narrow.luxury-paged .menu-page section ul{
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:none;
  height:auto;
  gap:12px;
}

#stage.theme-luxury #menu.screen3.narrow.luxury-paged .dish-card{
  min-height:170px;
}

#stage.theme-luxury #menu.screen3.narrow.luxury-paged .dish-photo{
  width:48%;
  height:auto;
}

#stage.theme-luxury #menu.screen3.narrow.luxury-paged .dish-name{
  font-size:20px;
}

#stage.theme-luxury #menu.screen3.narrow.luxury-paged .dish-meta .p{
  font-size:22px;
}

/* СЛОИ: АТМОСФЕРА НИЖЕ МЕНЮ */

#stage.screen3-stage.screen3-bg > #atmosphere{
  position:absolute !important;
  z-index:1 !important;
}

#stage.screen3-stage.screen3-bg > #menu,
#stage.screen3-stage.screen3-bg > #video{
  position:relative !important;
  z-index:2 !important;
}

/* Уважение настройки уменьшения анимации */

@media(prefers-reduced-motion:reduce){
  #stage.screen3-stage.screen3-bg .smoke,
  #stage.screen3-stage.screen3-bg .fire-glow{
    animation:none !important;
  }

  #stage.theme-luxury #menu.screen3.luxury-paged .menu-page{
    transition:none;
  }
}

/* ЭКРАН 3 — КОМПОЗИЦИЯ ПО РЕФЕРЕНСУ FARMAJO */

</style>
</head>

<body>

<div id="stage">

  <!-- АНИМИРОВАННЫЕ СЛОИ -->
  <div id="atmosphere" aria-hidden="true">
    <div class="smoke smoke-one"></div>
    <div class="smoke smoke-two"></div>
    <div class="fire-glow"></div>
  </div>

  <div id="menu"></div>
  <div id="video"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>

<script>
const sb=supabase.createClient(CFG.url,CFG.key);
const ID=new URLSearchParams(location.search).get('id')||'screen1';

let vkey='';
let busy=false;
let again=false;

let menuPageTimer=null;
let menuPageIndex=0;

const esc=s=>String(s==null?'':s).replace(/[&<>\"]/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;'
}[c]));

async function load(){

  const r=await Promise.all([
    sb.from('screens').select('*').eq('id',ID).single(),
    sb.from('categories').select('*').order('sort'),
    sb.from('items').select('*').eq('active',true).order('sort'),
    sb.from('screen_categories').select('*').eq('screen_id',ID),
    sb.from('videos').select('*').eq('screen_id',ID).eq('active',true).order('sort'),
    sb.from('settings').select('*')
  ]);

  for(const x of r)if(x.error)throw x.error;

  const vis={};
  let season='';
  let screen3Logo='';
  let screen3LogoEnabled=true;
  const categoryTitleVisibility={};

  r[3].data.forEach(x=>vis[x.category_id]=x.visible);

  window.__displayScaleConfig={};
  r[5].data.forEach(x=>{
    if(x.key==='season')season=x.value;
    if(x.key==='screen3_logo_url')screen3Logo=x.value;
    if(x.key==='screen3_logo_enabled')screen3LogoEnabled=x.value!=='false';
    if(x.key.startsWith('screen3_category_title_'))categoryTitleVisibility[x.key.replace('screen3_category_title_','')]=x.value!=='false';
    if(x.key==='menu_theme')window.__menuTheme=x.value||'dark';
    if(x.key.startsWith('display_scale_mode_'))window.__displayScaleConfig[x.key.replace('display_scale_mode_','')]={...(window.__displayScaleConfig[x.key.replace('display_scale_mode_','')]||{}),mode:x.value};
    if(x.key.startsWith('display_scale_percent_'))window.__displayScaleConfig[x.key.replace('display_scale_percent_','')]={...(window.__displayScaleConfig[x.key.replace('display_scale_percent_','')]||{}),percent:x.value};
  });

  render(
    r[0].data,
    r[1].data.filter(c=>vis[c.id]&&(!c.season||c.season===season)),
    r[2].data,
    r[4].data.filter(v=>!v.season||v.season===season),
    screen3Logo,
    screen3LogoEnabled,
    categoryTitleVisibility
  );
}

function render(scr,cats,items,vids,screen3Logo,screen3LogoEnabled,categoryTitleVisibility){

  const selectedTheme=(window.__menuTheme||'dark');
  const stage=document.getElementById('stage');

  stage.classList.toggle(
    'screen3-bg',
    ID==='screen3'&&selectedTheme==='luxury'
  );

  stage.classList.toggle(
    'theme-light',
    selectedTheme==='light'
  );

  stage.classList.toggle(
    'theme-luxury',
    selectedTheme==='luxury'
  );

  stage.classList.toggle(
    'screen3-stage',
    ID==='screen3'&&selectedTheme==='luxury'
  );

  const vid=!!scr.video_enabled;
  const wide=!vid||scr.menu_width>=60;
  const mw=wide?1920:Math.round(1920*scr.menu_width/100);

  const luxury3=ID==='screen3'&&selectedTheme==='luxury';

  const dishCard=i=>`
    <li class="dish-card">
      ${i.photo_url
        ?`<img class="dish-photo" src="${esc(i.photo_url)}" alt="${esc(i.name)}">`
        :`<div class="dish-photo dish-placeholder" aria-hidden="true">FARMAJO</div>`
      }
      <div class="dish-info">
        <span class="n dish-name">${esc(i.name)}</span>
        <div class="dish-meta">
          ${i.weight_g
            ?`<span class="v">${i.weight_g} г</span>`
            :i.volume_ml
              ?`<span class="v">${i.volume_ml} мл</span>`
              :''
          }
          <span class="p cu">${+i.price}</span>
        </div>
      </div>
    </li>
  `;

  const normalDish=i=>`
    <li>
      ${i.photo_url?`<img class="ph" src="${esc(i.photo_url)}" alt="">`:''}
      <span class="n">${esc(i.name)}</span>
      ${i.weight_g
        ?`<span class="v">${i.weight_g} г</span>`
        :i.volume_ml
          ?`<span class="v">${i.volume_ml} мл</span>`
          :''
      }
      <span class="d"></span>
      <span class="p cu">${+i.price}</span>
    </li>
  `;

  let body='';

  if(luxury3){

    const pages=[];

    cats.forEach(c=>{
      const list=items.filter(i=>i.category_id===c.id);

      for(let j=0;j<list.length;j+=9){
        pages.push({
          category:c,
          items:list.slice(j,j+9),
          part:j/9+1,
          total:Math.ceil(list.length/9)
        });
      }
    });

    body=pages.map((page,index)=>`
      <div class="menu-page${index===0?' active':''}" data-page="${index}">
        <main>
          <section class="${categoryTitleVisibility[String(page.category.id)]===false?'category-title-hidden':''}">
            <h2 class="cu">${esc(page.category.name)}</h2>
            <ul>${page.items.map(dishCard).join('')}</ul>
          </section>
        </main>
      </div>
    `).join('');

  }else{

    body=cats.map(c=>{
      const li=items
        .filter(i=>i.category_id===c.id)
        .map(normalDish)
        .join('');

      return li
        ?`<section><h2 class="cu">${esc(c.name)}</h2><ul>${li}</ul></section>`
        :'';
    }).join('');

  }

  const title=scr.name;

  const showLogo=ID!=='screen3'||screen3LogoEnabled;
  const logo=ID==='screen3'?(screen3Logo||'logo.png'):'logo.png';

  const head=luxury3
    ? `<header class="screen3-luxury-head">
        <div class="screen3-brand">
          ${showLogo?`<img src="${esc(logo)}" alt="FARMAJO">`:''}
          <div class="screen3-brand-copy"><strong>FARMAJO</strong></div>
        </div>
        <div class="screen3-main-title">
          <div class="screen3-title-rule"></div>
          <div class="screen3-flame" aria-hidden="true">♨</div>
          <div class="screen3-title-text">МЯСО НА МАНГАЛЕ</div>
          <div class="screen3-title-rule"></div>
        </div>
        <div class="screen3-tagline">Настоящий вкус<br>на живом огне</div>
      </header>`
    :wide
      ?`<header class="${ID==='screen3'?'screen3-head':''}">
          ${showLogo?`<img src="${esc(logo)}" alt="${esc(scr.name)}">`:''}
          <div class="t cu">${esc(scr.name)}</div>
        </header>`
      :`<div class="mt cu">${esc(title)}</div>`;

  const m=document.getElementById('menu');

  m.className=(ID==='screen3'?'screen3 ':'')+(wide?'':'narrow')+(luxury3?' show-category-titles':'');
  m.style.width=mw+'px';
  m.innerHTML=head+(luxury3?body:'<main>'+body+'</main>');

  if(luxury3){
    startMenuPaging();
  }else{
    m.classList.remove('luxury-paged');
    stopMenuPaging();
  }

  fit();
  f();

  const v=document.getElementById('video');

  v.style.display=vid&&!wide?'flex':'none';
  v.style.width=(1920-mw)+'px';

  const key=JSON.stringify([vid&&!wide,vids.map(x=>x.url)]);

  if(key===vkey)return;
  vkey=key;

  if(!(vid&&!wide))return;

  if(!vids.length){
    v.innerHTML=showLogo
      ?`<img src="${esc(logo)}" alt="${esc(scr.name)}">`
      :'';
    return;
  }

  v.innerHTML='<video muted autoplay playsinline></video>';

  const el=v.firstChild;
  el.muted=true;

  let n=0;

  el.src=vids[0].url;
  el.loop=vids.length===1;

  el.onended=()=>{
    n=(n+1)%vids.length;
    el.src=vids[n].url;
    el.play();
  };

  el.play().catch(()=>{});
}

/* ПЕРЕКЛЮЧЕНИЕ КАТЕГОРИЙ */

function stopMenuPaging(){

  if(menuPageTimer){
    clearInterval(menuPageTimer);
    menuPageTimer=null;
  }

  menuPageIndex=0;
}

function startMenuPaging(){

  stopMenuPaging();

  const menu=document.getElementById('menu');
  menu.classList.add('luxury-paged');

  const pages=[...menu.querySelectorAll('.menu-page')];

  if(pages.length<2)return;

  menuPageIndex=0;

  menuPageTimer=setInterval(()=>{

    const current=pages[menuPageIndex];

    if(!current)return;

    current.classList.remove('active');

    menuPageIndex=(menuPageIndex+1)%pages.length;

    pages[menuPageIndex].classList.add('active');

  },9000);
}

/* ПОДГОНКА ТЕКСТА */

function fit(){

  document.querySelectorAll('#menu li').forEach(li=>{

    const n=li.querySelector('.n');

    if(!n)return;

    n.style.fontSize='';

    let fs=parseFloat(getComputedStyle(n).fontSize);

    while(li.scrollWidth>li.clientWidth+1&&fs>14){
      fs-=1;
      n.style.fontSize=fs+'px';
    }

  });
}

if(document.fonts&&document.fonts.ready){
  document.fonts.ready.then(fit);
}

/* ОБНОВЛЕНИЕ МЕНЮ */

async function refresh(){

  if(busy){
    again=true;
    return;
  }

  busy=true;

  try{
    await load();
  }catch(e){
    console.error(e);
    setTimeout(refresh,10000);
  }

  busy=false;

  if(again){
    again=false;
    refresh();
  }
}

let t;

sb.channel('live')
  .on('postgres_changes',{
    event:'*',
    schema:'public'
  },()=>{
    clearTimeout(t);
    t=setTimeout(refresh,400);
  })
  .subscribe();

setInterval(refresh,60000);

refresh();

/* МАСШТАБИРОВАНИЕ ЭКРАНА */

function f(){

  const fitScale=Math.min(innerWidth/1920,innerHeight/1080);
  const cfg=(window.__displayScaleConfig||{})[ID]||{};
  const manual=cfg.mode==='manual';
  const percent=Math.max(25,Math.min(150,Number(cfg.percent)||100));
  const s=fitScale*(manual?percent/100:1);
  const e=document.getElementById('stage');

  e.style.transform='scale('+s+')';
  e.style.marginLeft=(-960*s)+'px';
  e.style.marginTop=(-540*s)+'px';
}

addEventListener('resize',f);

f();
</script>
